<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="割り勘くん" />
<title>割り勘くん</title>
<meta name="description" content="割り勘のためのアプリ" />
<meta property="og:type" content="website" />
<meta property="og:title" content="割り勘くん" />
<meta property="og:description" content="割り勘のためのアプリ" />
<meta property="og:url" content="https://warikan-kun.pages.dev/" />
<meta property="og:site_name" content="割り勘くん" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="割り勘くん" />
<meta name="twitter:description" content="割り勘のためのアプリ" />
<style>
  :root {
    --bg: #000;
    --bg-elev-1: #1c1c1e;
    --bg-elev-2: #2c2c2e;
    --bg-elev-3: #3a3a3c;
    --separator: rgba(84, 84, 88, 0.6);
    --separator-thin: rgba(84, 84, 88, 0.35);
    --fill: rgba(120, 120, 128, 0.16);
    --fill-2: rgba(120, 120, 128, 0.24);
    --text: #fff;
    --text-2: rgba(235, 235, 245, 0.6);
    --text-3: rgba(235, 235, 245, 0.3);
    --accent: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
    --pink: #ff375f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 17px;
    line-height: 1.35;
  }

  body {
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    background: none;
    color: inherit;
  }

  input {
    font-family: inherit;
  }

  .app {
    max-width: 520px;
    margin: 0 auto;
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
  }

  /* Navigation bar */
  .nav-bar {
    padding: 16px 20px 4px;
    display: flex;
    justify-content: center;
  }

  .room-switcher {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    background: var(--fill);
    transition: background 0.15s, transform 0.1s;
    max-width: 100%;
  }
  .room-switcher .home { font-size: 14px; }
  .room-switcher .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-switcher .caret { font-size: 9px; color: var(--text-3); margin-top: 2px; }
  .room-switcher:active { background: var(--fill-2); transform: scale(0.97); }

  /* Grouped section */
  .group {
    margin: 16px 16px 24px;
  }

  .group-header {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-2);
    padding: 0 16px 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .group-header .action {
    color: var(--accent);
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
    padding: 4px 8px;
    margin: -4px -8px -4px 0;
    border-radius: 6px;
    font-weight: 400;
  }
  .group-header .action:active { background: var(--fill); }

  .card {
    background: var(--bg-elev-1);
    border-radius: 14px;
    overflow: hidden;
  }

  /* Summary card */
  .total-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 16px 16px 14px;
  }
  .total-row .label-k { font-size: 15px; color: var(--text-2); }
  .total-row .label-v {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .person-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 10px 16px;
  }
  .person-row + .person-row {
    border-top: 0.5px solid var(--separator);
  }
  .summary-card .person-row:first-of-type {
    border-top: 0.5px solid var(--separator);
  }

  .avatar-emoji {
    font-size: 24px;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    line-height: 1;
  }
  .person-row .pname {
    font-size: 15px;
    font-weight: 500;
  }
  .person-row .paid {
    font-size: 13px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }
  .person-row .bal {
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 90px;
    text-align: right;
  }

  /* Settlement card */
  .settle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
  }
  .settle-row + .settle-row { border-top: 0.5px solid var(--separator); }
  .settle-row .text {
    font-size: 17px;
    font-weight: 500;
  }
  .settle-row .arrow {
    color: var(--text-3);
    margin: 0 6px;
    font-weight: 400;
  }
  .settle-row .amt {
    font-size: 17px;
    font-weight: 700;
    color: var(--green);
    font-variant-numeric: tabular-nums;
  }

  .settled-msg {
    text-align: center;
    padding: 18px 16px;
    color: var(--text-2);
    font-size: 15px;
  }

  /* History list */
  .entries {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .entry-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    min-height: 56px;
    animation: fadeSlide 0.22s ease;
  }
  .entry-row + .entry-row {
    border-top: 0.5px solid var(--separator);
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-2px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .entry-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .entry-name {
    font-size: 17px;
    font-weight: 500;
  }
  .entry-meta-line {
    font-size: 13px;
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .entry-meta-line .mini { font-size: 13px; }
  .entry-meta-line .sep { color: var(--text-3); margin: 0 2px; }

  .entry-amount {
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .delete-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    color: var(--text-3);
    font-size: 20px;
    line-height: 1;
    display: grid;
    place-items: center;
    transition: background 0.18s, color 0.18s;
  }
  .delete-btn:active {
    background: rgba(255, 69, 58, 0.2);
    color: var(--red);
  }

  .empty-state {
    text-align: center;
    color: var(--text-3);
    font-size: 15px;
    padding: 32px 16px;
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 56px;
    height: 56px;
    border-radius: 28px;
    background: var(--accent);
    color: white;
    box-shadow: 0 8px 24px rgba(10, 132, 255, 0.4), 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    z-index: 40;
    padding: 0;
  }
  .fab::before, .fab::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    background: currentColor;
    border-radius: 2px;
  }
  .fab::before {
    width: 22px;
    height: 3px;
    transform: translate(-50%, -50%);
  }
  .fab::after {
    width: 3px;
    height: 22px;
    transform: translate(-50%, -50%);
  }
  .fab:active {
    transform: translateX(-50%) scale(0.92);
    box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3), 0 1px 3px rgba(0, 0, 0, 0.3);
  }

  @media (min-width: 520px) {
    .fab { left: auto; right: max(20px, calc(50vw - 240px)); transform: none; }
    .fab:active { transform: scale(0.92); }
  }

  /* Sheets (room / entry) */
  dialog.sheet {
    border: none;
    background: transparent;
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    color: var(--text);
  }
  dialog.sheet::backdrop {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .sheet-inner {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 520px;
    margin: 0 auto;
    background: var(--bg-elev-1);
    border-radius: 14px 14px 0 0;
    padding: 8px 0 calc(16px + env(safe-area-inset-bottom));
    animation: slideUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 92vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .handle {
    width: 36px;
    height: 5px;
    border-radius: 2.5px;
    background: var(--bg-elev-3);
    margin: 6px auto 4px;
  }

  .sheet-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 8px 16px 12px;
    gap: 8px;
  }
  .sheet-head .title {
    text-align: center;
    font-size: 17px;
    font-weight: 600;
  }
  .sheet-head .left, .sheet-head .right {
    display: flex;
  }
  .sheet-head .left { justify-content: flex-start; }
  .sheet-head .right { justify-content: flex-end; }
  .sheet-head button {
    color: var(--accent);
    font-size: 17px;
    padding: 6px 4px;
    border-radius: 8px;
  }
  .sheet-head button.bold { font-weight: 600; }
  .sheet-head button:active { background: var(--fill); }
  .sheet-head button:disabled { color: var(--text-3); }

  .sheet-body { padding: 0 16px; }

  /* Entry sheet form */
  .field-label {
    font-size: 13px;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 16px 0 8px;
    padding-left: 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .field-label .hint {
    color: var(--text-3);
    font-size: 12px;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }

  /* Segmented control (payer) */
  .segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    background: var(--fill);
    border-radius: 9px;
    padding: 2px;
    position: relative;
  }
  .seg-item {
    position: relative;
    text-align: center;
    padding: 10px 6px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .seg-item input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-item .emoji { font-size: 17px; line-height: 1; }
  .seg-item[data-active="true"] {
    background: var(--bg-elev-2);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  /* Chips (beneficiaries) */
  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip {
    position: relative;
    background: var(--fill);
    padding: 12px 8px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.18s, opacity 0.18s, color 0.18s;
    user-select: none;
  }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip .emoji { font-size: 17px; line-height: 1; }
  .chip[data-active="false"] { opacity: 0.4; }
  .chip[data-active="true"] {
    background: rgba(10, 132, 255, 0.18);
    color: #5ac8fa;
  }

  /* Amount field */
  .amount-field {
    background: var(--bg-elev-2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    height: 56px;
  }
  .amount-field .yen {
    font-size: 22px;
    color: var(--text-2);
    margin-right: 4px;
    font-weight: 400;
  }
  .amount-field input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 28px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    outline: none;
    padding: 0;
  }
  .amount-field input::placeholder { color: var(--text-3); font-weight: 400; }

  /* Note field */
  .note-field {
    background: var(--bg-elev-2);
    border-radius: 10px;
    padding: 14px;
  }
  .note-field input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 17px;
    outline: none;
  }
  .note-field input::placeholder { color: var(--text-3); }

  /* Room sheet */
  .room-list {
    background: var(--bg-elev-2);
    border-radius: 10px;
    overflow: hidden;
  }
  .room-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
  }
  .room-row + .room-row { border-top: 0.5px solid var(--separator); }
  .room-pick {
    background: transparent;
    text-align: left;
    padding: 14px 16px;
    font-size: 17px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    width: 100%;
  }
  .room-pick .dot {
    width: 16px;
    font-size: 16px;
    color: transparent;
    flex-shrink: 0;
  }
  .room-row[data-current="true"] .room-pick .dot::before {
    content: "✓";
    color: var(--accent);
    font-weight: 700;
  }
  .room-pick .rn {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .room-edit, .room-del {
    width: 44px;
    height: 44px;
    color: var(--accent);
    font-size: 17px;
    display: grid;
    place-items: center;
  }
  .room-del { color: var(--red); }
  .room-edit:active, .room-del:active { background: var(--fill); }

  .room-create {
    width: 100%;
    background: var(--accent);
    color: white;
    padding: 14px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 600;
    margin-top: 14px;
    transition: opacity 0.15s;
  }
  .room-create:active { opacity: 0.7; }

  /* Name dialog (iOS alert style) */
  dialog.name-dialog {
    border: none;
    background: transparent;
    padding: 0;
    margin: auto;
    max-width: 280px;
    width: calc(100% - 64px);
    color: var(--text);
  }
  dialog.name-dialog::backdrop {
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .nd-form {
    background: rgba(50, 50, 56, 0.92);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border-radius: 14px;
    overflow: hidden;
    animation: popIn 0.2s cubic-bezier(0.32, 0.72, 0, 1);
    text-align: center;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
  .nd-title {
    font-size: 17px;
    font-weight: 600;
    padding: 20px 16px 6px;
  }
  .nd-form input {
    width: calc(100% - 24px);
    margin: 14px 12px 4px;
    background: rgba(0, 0, 0, 0.3);
    border: 0.5px solid var(--separator);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 15px;
    text-align: left;
  }
  .nd-counter {
    font-size: 11px;
    color: var(--text-3);
    padding: 4px 12px 14px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .nd-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-top: 0.5px solid var(--separator);
  }
  .nd-cancel, .nd-ok {
    background: transparent;
    padding: 12px;
    font-size: 17px;
    color: var(--accent);
    transition: background 0.15s;
  }
  .nd-ok { font-weight: 600; }
  .nd-cancel { border-right: 0.5px solid var(--separator); }
  .nd-cancel:active, .nd-ok:active:not(:disabled) { background: rgba(255, 255, 255, 0.06); }
  .nd-ok:disabled { color: var(--text-3); }
</style>
</head>
<body>
  <div class="app">
    <header class="nav-bar">
      <button class="room-switcher" id="room-bar" type="button" aria-haspopup="dialog">
        <span class="home">🏠</span>
        <span class="rn" id="room-bar-name">部屋</span>
        <span class="caret">▼</span>
      </button>
    </header>

    <section class="group" id="summary-group" style="display:none;">
      <div class="group-header">集計</div>
      <div class="card summary-card">
        <div class="total-row">
          <span class="label-k">合計</span>
          <span class="label-v" id="grand-total">¥0</span>
        </div>
        <div id="breakdown"></div>
      </div>
    </section>

    <section class="group" id="settle-group" style="display:none;">
      <div class="group-header">精算</div>
      <div class="card" id="settlements"></div>
    </section>

    <section class="group">
      <div class="group-header">
        <span>履歴</span>
        <button class="action" id="reset-btn" type="button">全削除</button>
      </div>
      <div class="card">
        <ul class="entries" id="entries-list"></ul>
        <div class="empty-state" id="empty-state">まだ何も登録されていません</div>
      </div>
    </section>
  </div>

  <button class="fab" id="fab" type="button" aria-label="新規追加"></button>

  <dialog class="sheet" id="entry-sheet" aria-label="新規追加">
    <div class="sheet-inner">
      <div class="handle"></div>
      <div class="sheet-head">
        <div class="left"><button type="button" id="es-cancel">キャンセル</button></div>
        <div class="title">新規追加</div>
        <div class="right"><button type="submit" form="entry-form" class="bold" id="es-done">追加</button></div>
      </div>
      <form class="sheet-body" id="entry-form" autocomplete="off">
        <div class="field-label">支払者</div>
        <div class="segmented" id="person-picker">
          <label class="seg-item" data-id="funjin">
            <input type="radio" name="person" value="funjin" />
            <span class="emoji">💥</span>粉塵爆発
          </label>
          <label class="seg-item" data-id="pants">
            <input type="radio" name="person" value="pants" />
            <span class="emoji">🩲</span>ぱんつ
          </label>
          <label class="seg-item" data-id="jaga">
            <input type="radio" name="person" value="jaga" />
            <span class="emoji">🥔</span>じゃが
          </label>
        </div>

        <div class="field-label">
          <span>対象者</span>
          <span class="hint" id="bene-hint">全員</span>
        </div>
        <div class="chips" id="bene-picker">
          <label class="chip" data-id="funjin" data-active="true">
            <input type="checkbox" name="bene" value="funjin" checked />
            <span class="emoji">💥</span>粉塵爆発
          </label>
          <label class="chip" data-id="pants" data-active="true">
            <input type="checkbox" name="bene" value="pants" checked />
            <span class="emoji">🩲</span>ぱんつ
          </label>
          <label class="chip" data-id="jaga" data-active="true">
            <input type="checkbox" name="bene" value="jaga" checked />
            <span class="emoji">🥔</span>じゃが
          </label>
        </div>

        <div class="field-label">金額</div>
        <div class="amount-field">
          <span class="yen">¥</span>
          <input type="number" id="amount" min="1" step="1" inputmode="numeric" placeholder="0" required />
        </div>

        <div class="field-label">メモ (任意)</div>
        <div class="note-field">
          <input type="text" id="note" maxlength="60" placeholder="例: ランチ、コンビニ" />
        </div>
      </form>
    </div>
  </dialog>

  <dialog class="sheet" id="room-sheet" aria-label="部屋の切り替え">
    <div class="sheet-inner">
      <div class="handle"></div>
      <div class="sheet-head">
        <div class="left"></div>
        <div class="title">部屋</div>
        <div class="right"><button type="button" id="room-sheet-close">閉じる</button></div>
      </div>
      <div class="sheet-body">
        <div class="room-list" id="room-list"></div>
        <button class="room-create" id="room-create" type="button">＋ 新しい部屋</button>
      </div>
    </div>
  </dialog>

  <dialog class="name-dialog" id="name-dialog" aria-labelledby="nd-title">
    <form class="nd-form" id="nd-form">
      <div class="nd-title" id="nd-title">部屋の名前</div>
      <input type="text" id="nd-input" maxlength="30" autocomplete="off" placeholder="例: 旅行2026春" />
      <div class="nd-counter"><span id="nd-count">0</span> / 30</div>
      <div class="nd-actions">
        <button type="button" class="nd-cancel" id="nd-cancel">キャンセル</button>
        <button type="submit" class="nd-ok" id="nd-ok" disabled>決定</button>
      </div>
    </form>
  </dialog>

<script>
  const PEOPLE = [
    { id: "funjin", name: "粉塵爆発", emoji: "💥" },
    { id: "pants",  name: "ぱんつ",   emoji: "🩲" },
    { id: "jaga",   name: "じゃが",   emoji: "🥔" },
  ];

  const byId = (id) => PEOPLE.find(p => p.id === id);

  const STORAGE = {
    rooms: "warikan-kun:v2:rooms",
    current: "warikan-kun:v2:current",
    entries: (id) => `warikan-kun:v2:entries:${id}`,
    version: (id) => `warikan-kun:v2:version:${id}`,
    v1: "warikan-kun:v1",
  };

  const API_BASE = "/api/rooms";

  const formatYen = (n) => `¥${Math.round(n).toLocaleString("ja-JP")}`;
  const newId = () => crypto.randomUUID().replace(/-/g, "").slice(0, 16);

  const loadVersion = (id) => localStorage.getItem(STORAGE.version(id)) || null;
  const saveVersion = (id, v) => localStorage.setItem(STORAGE.version(id), v);

  const apiGet = async (id) => {
    const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}`, { method: "GET" });
    if (res.status === 404) return { status: 404 };
    if (!res.ok) throw new Error(`GET ${res.status}`);
    return { status: 200, data: await res.json() };
  };

  const apiPut = async (id, body, ifMatch) => {
    const headers = { "Content-Type": "application/json" };
    if (ifMatch) headers["If-Match"] = `"${ifMatch}"`;
    const res = await fetch(`${API_BASE}/${encodeURIComponent(id)}`, {
      method: "PUT",
      headers,
      body: JSON.stringify(body),
    });
    if (res.status === 409) return { status: 409, conflict: (await res.json()).current };
    if (!res.ok) throw new Error(`PUT ${res.status}`);
    return { status: 200, data: await res.json() };
  };

  let syncStatus = "idle";
  const updateSyncBadge = () => {
    const el = document.getElementById("sync-badge");
    if (!el) return;
    el.dataset.status = syncStatus;
    const labels = { idle: "✓ 同期済み", syncing: "↻ 同期中", offline: "⚠ オフライン", conflict: "↻ 反映中" };
    el.textContent = labels[syncStatus] || "";
  };
  const setSyncStatus = (s) => { syncStatus = s; updateSyncBadge(); };

  const safeParse = (raw, fallback) => {
    try { const v = JSON.parse(raw); return v ?? fallback; } catch { return fallback; }
  };

  const loadRooms = () => {
    const raw = localStorage.getItem(STORAGE.rooms);
    return raw ? (Array.isArray(safeParse(raw, [])) ? safeParse(raw, []) : []) : [];
  };
  const saveRooms = (rs) => localStorage.setItem(STORAGE.rooms, JSON.stringify(rs));
  const loadEntries = (roomId) => {
    if (!roomId) return [];
    const raw = localStorage.getItem(STORAGE.entries(roomId));
    const parsed = raw ? safeParse(raw, []) : [];
    return Array.isArray(parsed) ? parsed : [];
  };
  const saveEntriesFor = (roomId, e) => localStorage.setItem(STORAGE.entries(roomId), JSON.stringify(e));

  const migrate = () => {
    let rs = loadRooms();
    if (rs.length > 0) return rs;
    const v1raw = localStorage.getItem(STORAGE.v1);
    const v1Entries = v1raw ? safeParse(v1raw, null) : null;
    const id = newId();
    const room = { id, name: "デフォルト", createdAt: Date.now() };
    saveRooms([room]);
    if (Array.isArray(v1Entries) && v1Entries.length > 0) {
      saveEntriesFor(id, v1Entries);
    }
    localStorage.setItem(STORAGE.current, id);
    return [room];
  };

  let rooms = migrate();

  const readHashRoom = () => {
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    return hash.get("r");
  };
  const writeHashRoom = (id) => {
    const hash = new URLSearchParams();
    hash.set("r", id);
    history.replaceState(null, "", "#" + hash.toString());
  };

  let currentRoomId = (() => {
    const fromHash = readHashRoom();
    if (fromHash && rooms.find(r => r.id === fromHash)) return fromHash;
    const stored = localStorage.getItem(STORAGE.current);
    if (stored && rooms.find(r => r.id === stored)) return stored;
    return rooms[0]?.id || null;
  })();

  let entries = loadEntries(currentRoomId);
  if (currentRoomId) writeHashRoom(currentRoomId);
  const persistEntries = () => saveEntriesFor(currentRoomId, entries);

  let pushTimer = null;
  const schedulePush = (roomId) => {
    clearTimeout(pushTimer);
    setSyncStatus("syncing");
    pushTimer = setTimeout(() => pushRoom(roomId), 350);
  };

  const applyServerState = (roomId, data) => {
    if (!data) return;
    if (typeof data.name === "string" && data.name) {
      const room = rooms.find(r => r.id === roomId);
      if (room && room.name !== data.name) {
        rooms = rooms.map(r => r.id === roomId ? { ...r, name: data.name } : r);
        saveRooms(rooms);
      }
    }
    const serverEntries = Array.isArray(data.entries) ? data.entries : [];
    saveEntriesFor(roomId, serverEntries);
    if (data.version) saveVersion(roomId, data.version);
    if (roomId === currentRoomId) {
      entries = serverEntries;
      render();
    } else {
      renderRoomBar();
      renderRoomList();
    }
  };

  const pullRoom = async (roomId) => {
    if (!roomId) return;
    try {
      setSyncStatus("syncing");
      const res = await apiGet(roomId);
      if (res.status === 200) {
        applyServerState(roomId, res.data);
        setSyncStatus("idle");
      } else if (res.status === 404) {
        await pushRoom(roomId, true);
      }
    } catch {
      setSyncStatus("offline");
    }
  };

  const pushRoom = async (roomId, ignoreVersion = false) => {
    if (!roomId) return;
    const room = rooms.find(r => r.id === roomId);
    if (!room) return;
    const body = { name: room.name, entries: loadEntries(roomId) };
    const v = ignoreVersion ? null : loadVersion(roomId);
    try {
      setSyncStatus("syncing");
      const res = await apiPut(roomId, body, v);
      if (res.status === 200) {
        if (res.data.version) saveVersion(roomId, res.data.version);
        setSyncStatus("idle");
      } else if (res.status === 409) {
        applyServerState(roomId, res.conflict);
        setSyncStatus("idle");
      }
    } catch {
      setSyncStatus("offline");
    }
  };

  const setCurrentRoom = (id) => {
    if (id === currentRoomId) return;
    currentRoomId = id;
    entries = loadEntries(id);
    localStorage.setItem(STORAGE.current, id);
    writeHashRoom(id);
    render();
    pullRoom(id);
  };

  const createRoom = (name) => {
    const id = newId();
    rooms = [...rooms, { id, name, createdAt: Date.now() }];
    saveRooms(rooms);
    saveEntriesFor(id, []);
    currentRoomId = id;
    entries = [];
    localStorage.setItem(STORAGE.current, id);
    writeHashRoom(id);
    render();
    pushRoom(id, true);
  };

  const renameRoom = (id, name) => {
    rooms = rooms.map(r => r.id === id ? { ...r, name } : r);
    saveRooms(rooms);
    renderRoomBar();
    renderRoomList();
    schedulePush(id);
  };

  const deleteRoom = (id) => {
    if (rooms.length <= 1) { alert("最後の部屋は削除できません"); return; }
    const wasCurrent = id === currentRoomId;
    rooms = rooms.filter(r => r.id !== id);
    saveRooms(rooms);
    localStorage.removeItem(STORAGE.entries(id));
    localStorage.removeItem(STORAGE.version(id));
    if (wasCurrent) {
      currentRoomId = rooms[0].id;
      entries = loadEntries(currentRoomId);
      localStorage.setItem(STORAGE.current, currentRoomId);
      writeHashRoom(currentRoomId);
      render();
      pullRoom(currentRoomId);
    } else {
      renderRoomList();
    }
  };

  const joinRoomById = async (id) => {
    if (!id) return false;
    try {
      const res = await apiGet(id);
      if (res.status !== 200) return false;
      const name = res.data.name || "共有された部屋";
      rooms = [...rooms, { id, name, createdAt: Date.now() }];
      saveRooms(rooms);
      applyServerState(id, res.data);
      currentRoomId = id;
      entries = loadEntries(id);
      localStorage.setItem(STORAGE.current, id);
      render();
      return true;
    } catch {
      return false;
    }
  };

  const shareCurrentRoom = async () => {
    const url = new URL(location.href);
    url.hash = `r=${currentRoomId}`;
    const text = url.toString();
    try {
      await navigator.clipboard.writeText(text);
      const badge = document.getElementById("sync-badge");
      if (badge) {
        const old = badge.textContent;
        badge.textContent = "✓ URLコピー済";
        setTimeout(() => { badge.textContent = old; updateSyncBadge(); }, 1500);
      }
    } catch {
      prompt("このURLをコピーして共有してください", text);
    }
  };

  const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  const roomSheet = document.getElementById("room-sheet");
  const roomBarBtn = document.getElementById("room-bar");
  const roomListEl = document.getElementById("room-list");

  const entrySheet = document.getElementById("entry-sheet");
  const fab = document.getElementById("fab");

  const nameDialog = document.getElementById("name-dialog");
  const nameForm = document.getElementById("nd-form");
  const nameInput = document.getElementById("nd-input");
  const nameOk = document.getElementById("nd-ok");
  const nameCancel = document.getElementById("nd-cancel");
  const nameTitleEl = document.getElementById("nd-title");
  const nameCount = document.getElementById("nd-count");

  const askName = ({ title, defaultValue = "", okLabel = "決定", placeholder = "" }) =>
    new Promise((resolve) => {
      let resolved = false;
      const finish = (val) => {
        if (resolved) return;
        resolved = true;
        nameForm.onsubmit = null;
        nameCancel.onclick = null;
        nameDialog.oncancel = null;
        nameDialog.onclick = null;
        nameInput.oninput = null;
        nameDialog.close();
        resolve(val);
      };
      nameTitleEl.textContent = title;
      nameOk.textContent = okLabel;
      nameInput.placeholder = placeholder || "";
      nameInput.value = defaultValue;
      nameCount.textContent = String(defaultValue.length);
      nameOk.disabled = defaultValue.trim().length === 0;

      nameInput.oninput = () => {
        nameCount.textContent = String(nameInput.value.length);
        nameOk.disabled = nameInput.value.trim().length === 0;
      };
      nameForm.onsubmit = (e) => {
        e.preventDefault();
        const v = nameInput.value.trim();
        if (!v) return;
        finish(v.slice(0, 30));
      };
      nameCancel.onclick = () => finish(null);
      nameDialog.oncancel = (e) => { e.preventDefault(); finish(null); };
      nameDialog.onclick = (e) => { if (e.target === nameDialog) finish(null); };

      nameDialog.showModal();
      requestAnimationFrame(() => {
        nameInput.focus();
        nameInput.select();
      });
    });

  const renderRoomBar = () => {
    const cur = rooms.find(r => r.id === currentRoomId);
    document.getElementById("room-bar-name").textContent = cur?.name || "部屋";
  };

  const renderRoomList = () => {
    roomListEl.innerHTML = rooms.map(r => `
      <div class="room-row" data-current="${r.id === currentRoomId}">
        <button class="room-pick" data-id="${r.id}" type="button">
          <span class="dot"></span>
          <span class="rn">${escapeHtml(r.name)}</span>
        </button>
        <button class="room-edit" data-id="${r.id}" type="button" aria-label="名前変更">✎</button>
        <button class="room-del" data-id="${r.id}" type="button" aria-label="削除">⊖</button>
      </div>
    `).join("");
  };

  roomBarBtn.addEventListener("click", () => {
    renderRoomList();
    roomSheet.showModal();
  });
  document.getElementById("room-sheet-close").addEventListener("click", () => roomSheet.close());
  roomSheet.addEventListener("click", (e) => {
    if (e.target === roomSheet) roomSheet.close();
  });
  document.getElementById("room-create").addEventListener("click", async () => {
    const name = await askName({
      title: "新しい部屋",
      okLabel: "作成",
      placeholder: "例: 旅行2026春",
    });
    if (!name) return;
    createRoom(name);
    roomSheet.close();
  });
  roomListEl.addEventListener("click", async (e) => {
    const pick = e.target.closest(".room-pick");
    const edit = e.target.closest(".room-edit");
    const del = e.target.closest(".room-del");
    if (pick) {
      setCurrentRoom(pick.dataset.id);
      roomSheet.close();
    } else if (edit) {
      const cur = rooms.find(r => r.id === edit.dataset.id);
      const next = await askName({
        title: "部屋の名前を変更",
        defaultValue: cur?.name || "",
        okLabel: "保存",
      });
      if (!next) return;
      renameRoom(edit.dataset.id, next);
    } else if (del) {
      const cur = rooms.find(r => r.id === del.dataset.id);
      if (!confirm(`「${cur?.name || ""}」と全ての履歴を削除します。よろしいですか？`)) return;
      deleteRoom(del.dataset.id);
    }
  });

  window.addEventListener("hashchange", () => {
    const fromHash = readHashRoom();
    if (fromHash && fromHash !== currentRoomId && rooms.find(r => r.id === fromHash)) {
      setCurrentRoom(fromHash);
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  const picker = document.getElementById("person-picker");
  const benePicker = document.getElementById("bene-picker");
  const beneHint = document.getElementById("bene-hint");
  const form = document.getElementById("entry-form");
  const amountInput = document.getElementById("amount");
  const noteInput = document.getElementById("note");
  const doneBtn = document.getElementById("es-done");

  const updateDoneState = () => {
    const person = picker.querySelector('input[name="person"]:checked')?.value;
    const amount = Number(amountInput.value);
    const beneCount = benePicker.querySelectorAll('input[name="bene"]:checked').length;
    doneBtn.disabled = !(person && Number.isFinite(amount) && amount > 0 && beneCount > 0);
  };

  picker.addEventListener("change", () => {
    const selected = picker.querySelector('input[name="person"]:checked')?.value;
    picker.querySelectorAll("label[data-id]").forEach(el => {
      el.dataset.active = String(el.dataset.id === selected);
    });
    updateDoneState();
  });

  const updateBeneUI = () => {
    const checked = [];
    benePicker.querySelectorAll('input[name="bene"]').forEach(el => {
      const label = el.closest("label[data-id]");
      label.dataset.active = String(el.checked);
      if (el.checked) checked.push(el.value);
    });
    if (checked.length === 3) beneHint.textContent = "全員";
    else if (checked.length === 0) beneHint.textContent = "未選択";
    else beneHint.textContent = checked.map(id => byId(id).name).join(" / ");
    updateDoneState();
  };

  benePicker.addEventListener("change", updateBeneUI);
  updateBeneUI();

  amountInput.addEventListener("input", updateDoneState);

  const resetEntryForm = () => {
    picker.querySelectorAll('input[name="person"]').forEach(el => { el.checked = false; });
    picker.querySelectorAll("label[data-id]").forEach(el => { el.dataset.active = "false"; });
    benePicker.querySelectorAll('input[name="bene"]').forEach(el => { el.checked = true; });
    updateBeneUI();
    amountInput.value = "";
    noteInput.value = "";
    updateDoneState();
  };

  fab.addEventListener("click", () => {
    entrySheet.showModal();
    requestAnimationFrame(() => picker.querySelector('input[name="person"]')?.focus({ preventScroll: true }));
  });

  document.getElementById("es-cancel").addEventListener("click", () => {
    entrySheet.close();
    resetEntryForm();
  });
  entrySheet.addEventListener("click", (e) => {
    if (e.target === entrySheet) { entrySheet.close(); resetEntryForm(); }
  });
  entrySheet.addEventListener("cancel", () => {
    resetEntryForm();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const person = picker.querySelector('input[name="person"]:checked')?.value;
    const amount = Number(amountInput.value);
    const note = noteInput.value.trim();
    const beneficiaries = Array.from(
      benePicker.querySelectorAll('input[name="bene"]:checked')
    ).map(el => el.value);

    if (!person) return;
    if (!Number.isFinite(amount) || amount <= 0) return;
    if (beneficiaries.length === 0) return;

    entries = [
      { id: crypto.randomUUID(), person, amount, note, beneficiaries, createdAt: Date.now() },
      ...entries,
    ];
    persistEntries();
    render();
    schedulePush(currentRoomId);

    entrySheet.close();
    resetEntryForm();
  });

  document.getElementById("reset-btn").addEventListener("click", () => {
    if (entries.length === 0) return;
    if (!confirm("全ての履歴を削除します。よろしいですか？")) return;
    entries = [];
    persistEntries();
    render();
    schedulePush(currentRoomId);
  });

  document.getElementById("entries-list").addEventListener("click", (e) => {
    const btn = e.target.closest(".delete-btn");
    if (!btn) return;
    const id = btn.dataset.id;
    entries = entries.filter(x => x.id !== id);
    persistEntries();
    render();
    schedulePush(currentRoomId);
  });

  const beneOf = (entry) => {
    if (Array.isArray(entry.beneficiaries) && entry.beneficiaries.length > 0) {
      return entry.beneficiaries;
    }
    return PEOPLE.map(p => p.id);
  };

  const computeBalances = () => {
    const bal = {};
    for (const p of PEOPLE) bal[p.id] = 0;
    for (const e of entries) {
      const bene = beneOf(e);
      const share = e.amount / bene.length;
      bal[e.person] = (bal[e.person] || 0) + e.amount;
      for (const b of bene) bal[b] = (bal[b] || 0) - share;
    }
    return bal;
  };

  const computeSettlements = (balances) => {
    const list = PEOPLE.map(p => ({ id: p.id, balance: balances[p.id] || 0 }));
    const creditors = list.filter(b => b.balance > 0.5).sort((a, b) => b.balance - a.balance);
    const debtors   = list.filter(b => b.balance < -0.5).sort((a, b) => a.balance - b.balance);
    const results = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const d = debtors[i];
      const c = creditors[j];
      const pay = Math.min(-d.balance, c.balance);
      const rounded = Math.round(pay);
      if (rounded > 0) results.push({ from: d.id, to: c.id, amount: rounded });
      d.balance += pay;
      c.balance -= pay;
      if (Math.abs(d.balance) < 0.5) i++;
      if (Math.abs(c.balance) < 0.5) j++;
    }
    return results;
  };

  const renderEntries = () => {
    const list = document.getElementById("entries-list");
    const empty = document.getElementById("empty-state");
    list.innerHTML = "";
    if (entries.length === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    for (const entry of entries) {
      const p = byId(entry.person);
      if (!p) continue;
      const bene = beneOf(entry);
      const isAll = bene.length === PEOPLE.length;
      const metaPieces = [];
      if (!isAll) {
        metaPieces.push(bene.map(id => {
          const b = byId(id);
          return b ? `<span class="mini">${b.emoji}</span>` : "";
        }).join(""));
      }
      if (entry.note) {
        metaPieces.push(`<span>${escapeHtml(entry.note)}</span>`);
      }
      const metaHTML = metaPieces.length > 0
        ? `<div class="entry-meta-line">${metaPieces.join('<span class="sep">·</span>')}</div>`
        : "";
      const li = document.createElement("li");
      li.className = "entry-row";
      li.innerHTML = `
        <div class="avatar-emoji">${p.emoji}</div>
        <div class="entry-info">
          <span class="entry-name">${p.name}</span>
          ${metaHTML}
        </div>
        <div class="entry-amount">${formatYen(entry.amount)}</div>
        <button class="delete-btn" data-id="${entry.id}" aria-label="削除" title="削除">×</button>
      `;
      list.appendChild(li);
    }
  };

  const renderSummary = () => {
    const summary = document.getElementById("summary-group");
    const settle = document.getElementById("settle-group");

    if (entries.length === 0) {
      summary.style.display = "none";
      settle.style.display = "none";
      return;
    }
    summary.style.display = "block";
    settle.style.display = "block";

    const totals = {};
    for (const p of PEOPLE) totals[p.id] = 0;
    for (const e of entries) totals[e.person] = (totals[e.person] || 0) + e.amount;

    const grand = Object.values(totals).reduce((s, v) => s + v, 0);
    document.getElementById("grand-total").textContent = formatYen(grand);

    const balances = computeBalances();
    document.getElementById("breakdown").innerHTML = PEOPLE.map(p => {
      const bal = Math.round(balances[p.id] || 0);
      const paid = totals[p.id] || 0;
      const sign = bal > 0 ? "+" : bal < 0 ? "−" : "±";
      const color = bal > 0 ? "var(--green)" : bal < 0 ? "var(--red)" : "var(--text-2)";
      return `
        <div class="person-row">
          <div class="avatar-emoji">${p.emoji}</div>
          <span class="pname">${p.name}</span>
          <span class="paid">払 ${formatYen(paid)}</span>
          <span class="bal" style="color: ${color};">${sign}${formatYen(Math.abs(bal))}</span>
        </div>`;
    }).join("");

    const settlementsEl = document.getElementById("settlements");
    const settlements = computeSettlements(balances);
    if (settlements.length === 0) {
      settlementsEl.innerHTML = `<div class="settled-msg">ぴったり均等、精算不要</div>`;
      return;
    }
    settlementsEl.innerHTML = settlements.map(s => {
      const from = byId(s.from);
      const to = byId(s.to);
      return `
        <div class="settle-row">
          <span class="text">${from.emoji}${from.name}<span class="arrow">→</span>${to.emoji}${to.name}</span>
          <span class="amt">${formatYen(s.amount)}</span>
        </div>`;
    }).join("");
  };

  const render = () => { renderRoomBar(); renderEntries(); renderSummary(); updateSyncBadge(); };
  render();
  updateDoneState();

  (async () => {
    const fromHash = readHashRoom();
    if (fromHash && !rooms.find(r => r.id === fromHash)) {
      const joined = await joinRoomById(fromHash);
      if (joined) return;
    }
    if (currentRoomId) pullRoom(currentRoomId);
  })();

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && currentRoomId) {
      pullRoom(currentRoomId);
    }
  });

  document.getElementById("share-btn")?.addEventListener("click", shareCurrentRoom);
</script>
</body>
</html>
